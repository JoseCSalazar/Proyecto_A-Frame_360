  PEC 3: Entornos Inmersivos 360º con A-Frame
  Escena 2: Vídeo Panorámico 360º del Río Túria
  ---------------------------------- Autoria --------------------------------
  Vídeo 360º: "Río Túria" (./Recursos/RioTuria.mp4) por Grupo Audiovisual
  Modelo 3D: "butterfly.glb" por mcgamescompany en CGTrader (https://www.cgtrader.com/mcgamescompany)
  Interactividad: Script personalizado 'video-controls' y A-Frame Event Set Component
###############################################################################
-->
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PEC3 - Escena 2: Vídeo 360º del Río Túria</title>
  
  <!-- Librerías de la escena -->
  <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
  <script src="https://unpkg.com/aframe-event-set-component@5.0.0/dist/aframe-event-set-component.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/c-frame/aframe-extras@7.2.0/dist/aframe-extras.min.js"></script>

  <script>

    // Reproducir y pausar el vídeo
    AFRAME.registerComponent('video-controls', {
      init: function () {
        var video = document.querySelector('#video360');
        var playBtn = this.el;
        var playText = document.querySelector('#play-text');

        // Intenta reproducirlo al entrar
        document.addEventListener('DOMContentLoaded', function () {
          var scene = document.querySelector('a-scene');
          if (scene) {
            scene.addEventListener('loaded', function () {
              video.play().then(function() {
                playBtn.setAttribute('color', '#E64A19');
                playText.setAttribute('value', 'Detener Video');
              }).catch(function(err) {
                // Si el navegador lo bloquea, se inicia con el botón
                console.log("Autoplay bloqueado por el navegador:", err);
                playBtn.setAttribute('color', '#388E3C');
                playText.setAttribute('value', 'Reproducir Video');
              });
            });
          }
        });

        this.el.addEventListener('click', function () {
          if (video.paused) {
            video.play().then(function() {
              playBtn.setAttribute('color', '#E64A19');
              playText.setAttribute('value', 'Detener Video');
            }).catch(function(err) {
              console.log("Error al reproducir el vídeo:", err);
            });
          } else {
            video.pause();
            playBtn.setAttribute('color', '#388E3C');
            playText.setAttribute('value', 'Reproducir Video');
          }
        });
      }
    });
  </script>
</head>
<body>

  <a-scene>
    <!-- Vídeo y modelo de mariposa -->
    <a-assets>
      <video 
        id="video360" 
        src="./Recursos/RioTuria.mp4" 
        autoplay="true"
        preload="auto" 
        loop="true" 
        crossorigin="anonymous" 
        playsinline 
        webkit-playsinline>
      </video>
      <a-asset-item id="mariposa-model" src="./Recursos/butterfly.glb"></a-asset-item>
    </a-assets>

    <!-- Vídeo 360º -->
    <a-videosphere src="#video360" rotation="0 -90 0"></a-videosphere>

    <!-- Cámara -->
    <a-camera id="main-camera" cursor="rayOrigin: mouse" raycaster="objects: .interactivo, .link">
    </a-camera>

    <!-- Luces -->
    <a-light type="ambient" color="#FFFFFF" intensity="1.2"></a-light>
    <a-light type="directional" position="1 4 2" intensity="1.0"></a-light>

    <!-- Título -->
    <a-text 
      value="PEC3: Entorno Inmersivo Video 360" 
      position="0 2.8 -3.5" 
      align="center" 
      color="#FFFFFF" 
      scale="1.4 1.4 1.4"
      geometry="primitive: plane; width: 3.8; height: 0.6" 
      material="color: #1A237E; opacity: 0.85">
    </a-text>

    <!-- Mariposas -->
    <a-gltf-model 
      src="#mariposa-model" 
      position="-3.0 1.2 -4.8" 
      scale="0.12 0.12 0.12" 
      rotation="0 45 0"
      fix-color
      animation-mixer="clip: *; loop: repeat"
      animation__move="property: position; from: -3.0 1.2 -4.8; to: 0.5 1.8 -4.8; dir: alternate; loop: true; dur: 6500; easing: easeInOutSine"
      animation__rot="property: rotation; from: 0 30 0; to: 0 60 0; dir: alternate; loop: true; dur: 3000; easing: easeInOutSine">
    </a-gltf-model>

    <a-gltf-model 
      src="#mariposa-model" 
      position="2.8 1.6 -6.0" 
      scale="0.1 0.1 0.1" 
      rotation="0 20 0"
      fix-color
      animation-mixer="clip: *; loop: repeat"
      animation__move="property: position; from: 2.8 1.6 -6.0; to: -1.0 2.1 -6.0; dir: alternate; loop: true; dur: 8000; easing: easeInOutSine"
      animation__rot="property: rotation; from: 0 10 0; to: 0 45 0; dir: alternate; loop: true; dur: 3500; easing: easeInOutSine">
    </a-gltf-model>

    <a-gltf-model 
      src="#mariposa-model" 
      position="-1.2 0.8 -4.2" 
      scale="0.09 0.09 0.09" 
      rotation="0 60 0"
      fix-color
      animation-mixer="clip: *; loop: repeat"
      animation__move="property: position; from: -1.2 0.8 -4.2; to: 2.2 1.2 -4.2; dir: alternate; loop: true; dur: 5500; easing: easeInOutSine"
      animation__rot="property: rotation; from: 0 40 0; to: 0 80 0; dir: alternate; loop: true; dur: 2500; easing: easeInOutSine">
    </a-gltf-model>

    <a-gltf-model 
      src="#mariposa-model" 
      position="2.0 1.5 -7.5" 
      scale="0.08 0.08 0.08" 
      rotation="0 -30 0"
      fix-color
      animation-mixer="clip: *; loop: repeat"
      animation__move="property: position; from: 2.0 1.5 -7.5; to: -2.5 2.2 -7.5; dir: alternate; loop: true; dur: 9000; easing: easeInOutSine"
      animation__rot="property: rotation; from: 0 -20 0; to: 0 20 0; dir: alternate; loop: true; dur: 4000; easing: easeInOutSine">
    </a-gltf-model>

    <!-- Botón de reproducción -->
    <a-entity position="-1 1 -3">
      <a-box 
        class="interactivo" 
        video-controls 
        width="1.6" height="0.5" depth="0.1" 
        color="#E64A19" 
        material="opacity: 0.9"
        event-set__enter="_event: mouseenter; color: #BF360C"
        event-set__leave="_event: mouseleave; color: #E64A19">
        <a-text id="play-text" value="Detener Video" align="center" position="0 0 0.08" color="#FFFFFF" scale="0.7 0.7 0.7"></a-text>
      </a-box>
    </a-entity>

    <!-- Volver al paisaje -->
    <a-entity position="1 1 -3">
      <a-box 
        class="link" 
        width="1.6" height="0.5" depth="0.1" 
        color="#0288D1" 
        material="opacity: 0.9"
        event-set__enter="_event: mouseenter; color: #01579B"
        event-set__leave="_event: mouseleave; color: #0288D1"
        onclick="window.location.href='index.html'">
        <a-text value="Volver a Escena 1" align="center" position="0 0 0.08" color="#FFFFFF" scale="0.7 0.7 0.7"></a-text>
      </a-box>
    </a-entity>

  </a-scene>

</body>
</html>
